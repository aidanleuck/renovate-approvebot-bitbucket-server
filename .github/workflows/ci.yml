name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t renovate-approve-bot-bitbucket-server .
      - name: Test Docker image
        run: |
          docker run --rm \
            -e BITBUCKET_SERVER_URL=https://test.example.com \
            -e BITBUCKET_TOKEN=test-token \
            -e RENOVATE_BOT_USER=test-user \
            renovate-approve-bot-bitbucket-server \
            timeout 5 || true
